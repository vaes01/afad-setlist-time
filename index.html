<!DOCTYPE html>
<html>
<head>
    <title>AFAD Setlist Time</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #222;
            font-size: 2rem;
        }

        h2 {
            margin-top: 30px;
            color: #333;
            font-size: 1.4rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        button, select {
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
        }

        button:hover, select:hover { background-color: #e0e0e0; }

        #allSongs, #selectedSongs {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .song, .selected-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.1s, box-shadow 0.2s;
            font-size: 1.1rem;
            width: 450px; /* same width as selected setlist */
        }

        .song:hover, .selected-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .selected-item select {
            margin-left: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            padding: 6px 10px;
            background-color: #fafafa;
            font-size: 1.1rem;
        }

        .song input[type="checkbox"] {
            transform: scale(1.3);
            margin-right: 10px;
            cursor: pointer;
        }

        .song-label {
            flex: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        #totalTime, #selectedTotal, #songCount {
            font-weight: 600;
            font-size: 1.15rem;
            margin-top: 15px;
        }

        /* Mobile enhancements */
        @media (max-width: 600px) {
            h1 { font-size: 2.4rem; }
            h2 { font-size: 1.8rem; }
            .song, .selected-item { font-size: 1.4rem; padding: 18px 20px; width: 100%; }
            .selected-item select { font-size: 1.2rem; padding: 8px 12px; }
            .controls { font-size: 1.2rem; flex-direction: column; }
            button, select { font-size: 1.2rem; padding: 14px 20px; }
        }
    </style>
</head>
<body>

<h1>AFAD Setlist Time</h1>

<div class="controls">
    <button onclick="selectAll()">Select All</button>
    <button onclick="deselectAll()">Deselect All</button>

    <label>Sort All Songs:
        <select onchange="sortAllSongs(this.value)">
            <option value="name" selected>By Name</option>
            <option value="length">By Length</option>
        </select>
    </label>
</div>

<div id="allSongs"></div>

<div id="totalTime">Setlist Time: 0:00</div>
<div id="songCount">Songs Selected: 0</div>

<hr>

<h2>Selected Setlist</h2>
<div id="selectedSongs"></div>
<div id="selectedTotal">Selected Setlist Time: 0:00</div>

<script>
const songs = [
    {name:"The Second Fall", time:200, category:"AFAD"},
    {name:"Tomorrow", time:210, category:"AFAD"},
    {name:"Right on Time", time:208, category:"AFAD"},
    {name:"Too Late", time:186, category:"AFAD"},
    {name:"Good News", time:277, category:"AFAD"},
    {name:"Nothing New", time:197, category:"AFAD"},
    {name:"Another Day", time:272, category:"AFAD"},
    {name:"Turkeys Don't Fly", time:202, category:"AFAD"},
    {name:"Beauty and the Beast", time:171, category:"Cover"},
    {name:"Aliens Exist", time:196, category:"Cover"},
    {name:"All the Small Things", time:173, category:"Cover"},
    {name:"Disconnected", time:208, category:"Cover"},
    {name:"When I Come Around", time:187, category:"Cover"}
];

let selectedSongs = [];
const allSongsDiv = document.getElementById("allSongs");
const selectedDiv = document.getElementById("selectedSongs");

function formatTime(seconds){
    const m = Math.floor(seconds/60);
    const s = seconds%60;
    return m + ":" + String(s).padStart(2,"0");
}

/* ---------- SORT (AFAD FIRST) ---------- */
function sortAllSongs(type="name") {
    const categoryPriority = { "AFAD":0, "Cover":1 };
    songs.sort((a,b)=>{
        if(categoryPriority[a.category]!==categoryPriority[b.category])
            return categoryPriority[a.category]-categoryPriority[b.category];
        if(type==="name") return a.name.localeCompare(b.name);
        if(type==="length") return a.time-b.time;
        return 0;
    });
    renderAllSongs();
}

/* ---------- RENDER ALL SONGS ---------- */
function renderAllSongs(){
    allSongsDiv.innerHTML="";
    ["AFAD","Cover"].forEach(cat=>{
        const categorySongs = songs.filter(s=>s.category===cat);
        if(!categorySongs.length) return;

        const h=document.createElement("h2");
        h.textContent=cat+" Songs";
        allSongsDiv.appendChild(h);

        categorySongs.forEach(song=>{
            const div=document.createElement("div");
            div.className="song";

            const checkbox=document.createElement("input");
            checkbox.type="checkbox";
            checkbox.checked=selectedSongs.some(s=>s.name===song.name);

            const label = document.createElement("div");
            label.className="song-label";
            label.appendChild(checkbox);
            label.append(" "+song.name+" ("+formatTime(song.time)+")");

            // Only toggle when clicking outside the checkbox
            label.addEventListener("click", (e)=>{
                if(e.target !== checkbox){
                    checkbox.checked = !checkbox.checked;
                    checkbox.dispatchEvent(new Event('change'));
                }
            });

            checkbox.addEventListener("change", ()=>{
                if(checkbox.checked) selectedSongs.push({...song});
                else selectedSongs = selectedSongs.filter(s=>s.name!==song.name);
                renderSelected(); updateTotals(); renderAllSongs();
            });

            div.appendChild(label);
            allSongsDiv.appendChild(div);
        });
    });
}

/* ---------- RENDER SELECTED (Dropdown + Drag) ---------- */
function renderSelected(){
    selectedDiv.innerHTML="";
    selectedSongs.forEach((song,index)=>{
        const div=document.createElement("div");
        div.className="selected-item";
        div.dataset.index=index;

        const label=document.createElement("span");
        label.textContent=song.name+" ("+formatTime(song.time)+")";
        div.appendChild(label);

        const select=document.createElement("select");
        for(let i=1;i<=selectedSongs.length;i++){
            const option=document.createElement("option");
            option.value=i;
            option.textContent=i;
            if(i===index+1) option.selected=true;
            select.appendChild(option);
        }
        select.addEventListener("change", ()=>{
            const newIndex=parseInt(select.value)-1;
            moveSong(index,newIndex);
        });
        div.appendChild(select);

        selectedDiv.appendChild(div);
    });

    // SortableJS for drag & drop on touch devices
    Sortable.create(selectedDiv, {
        animation: 150,
        onEnd: function(evt) {
            const newOrder=[];
            selectedDiv.querySelectorAll(".selected-item").forEach(item=>{
                const idx=parseInt(item.dataset.index);
                newOrder.push(selectedSongs[idx]);
            });
            selectedSongs=newOrder;
            renderSelected(); // sync dropdown
        }
    });
}

/* ---------- MOVE SONG ---------- */
function moveSong(oldIndex,newIndex){
    if(oldIndex===newIndex) return;
    const moved=selectedSongs.splice(oldIndex,1)[0];
    selectedSongs.splice(newIndex,0,moved);
    renderSelected();
}

/* ---------- UPDATE TOTALS ---------- */
function updateTotals(){
    const total=selectedSongs.reduce((sum,s)=>sum+s.time,0);
    document.getElementById("totalTime").textContent="Setlist Time: "+formatTime(total);
    document.getElementById("selectedTotal").textContent="Selected Setlist Time: "+formatTime(total);
    document.getElementById("songCount").textContent="Songs Selected: "+selectedSongs.length;
}

/* ---------- SELECT ALL / DESELECT ALL ---------- */
function selectAll(){ selectedSongs=[...songs]; renderAllSongs(); renderSelected(); updateTotals(); }
function deselectAll(){ selectedSongs=[]; renderAllSongs(); renderSelected(); updateTotals(); }

/* ---------- INIT ---------- */
sortAllSongs("name");
updateTotals();
renderAllSongs();
renderSelected();
</script>

</body>
</html>
